<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request Details | TrashAway</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="firebase.js"></script>
</head>
<body>
  <div id="custom-cursor"><i data-lucide="package"></i></div>
  <main class="section" style="max-width:760px; margin:80px auto 120px;">
    <div class="glass-panel" style="padding:28px 30px;">
      <div class="request-detail-header">
        <div>
          <h2>Request Details</h2>
          <p>Full pickup information and contact details for this request.</p>
        </div>
        <div class="request-detail-status">
          <span id="status-badge" class="activity-badge status-pending">Pending</span>
          <a href="collector-dashboard.html" class="btn-ghost">Back</a>
        </div>
      </div>

      <div id="content"></div>
      <div id="actions" class="page-actions"></div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    lucide.createIcons();

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) document.getElementById('content').textContent = 'No request specified.';

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = 'login.html';
      // hide pills
      document.body.classList.add('hide-pill');

      try {
        const ref = doc(db, 'requests', id);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          document.getElementById('content').textContent = 'Request not found.';
          return;
        }
        const r = { id: snap.id, ...snap.data() };
        render(r);
      } catch (err) {
        console.error(err);
        document.getElementById('content').textContent = 'Failed to load request.';
      }
    });

    function render(r) {
      const created = r.createdAt && typeof r.createdAt.toDate === 'function' ? r.createdAt.toDate() : new Date(r.createdAt);
      const statusClass = r.status === 'complete' ? 'status-complete' : r.status === 'assigned' ? 'status-assigned' : 'status-pending';
      const statusText = r.status === 'complete' ? 'Completed' : r.status === 'assigned' ? 'Accepted' : 'Pending';
      const statusBadge = document.getElementById('status-badge');
      statusBadge.textContent = statusText;
      statusBadge.className = `activity-badge ${statusClass}`;

      document.getElementById('content').innerHTML = `
        <div class="request-detail-grid">
          <div class="request-detail-card">
            <h4>Pickup location</h4>
            <p>${r.address || r.area || 'Pickup location'}</p>
            <p style="margin-top: 10px; color: var(--text-muted);">${r.city || ''}, ${r.state || ''}</p>
          </div>
          <div class="request-detail-card">
            <h4>Waste type</h4>
            <p>${r.wasteType || 'Household (General)'}</p>
            <p style="margin-top: 10px; color: var(--text-muted);">${r.bagCount || '—'}</p>
          </div>
          <div class="request-detail-card">
            <h4>Pickup window</h4>
            <p>${r.pickupDay || 'Scheduled day'} • ${r.pickupTime || 'Time slot'}</p>
          </div>
          <div class="request-detail-card">
            <h4>Submitted</h4>
            <p>${created.toLocaleString()}</p>
          </div>
        </div>

        <div class="request-detail-card" style="margin-top:24px;">
          <h4>Contact information</h4>
          <p>${r.name || '—'}</p>
          <p style="margin-top:10px; color: var(--text-muted);">${r.phone || '—'} • ${r.email || '—'}</p>
        </div>

        ${r.notes ? `<div class="request-detail-card" style="margin-top:24px;"><h4>Notes</h4><p>${r.notes}</p></div>` : ''}

        <p style="margin-top:18px; color:var(--text-muted); font-size:13px;">Request ID: ${r.id}</p>
      `;

      const actions = document.getElementById('actions');
      actions.innerHTML = '';
      // Show Accept button only if not already assigned
      if (r.status !== 'assigned') {
        const btn = document.createElement('button');
        btn.className = 'btn-primary';
        btn.textContent = 'Accept Request';
        btn.addEventListener('click', async () => {
          try {
            // mark assigned to current user (collector) — fetch collector company name if exists
            const collectorRef = doc(db, 'collectors', auth.currentUser.uid);
            const collectorSnap = await getDoc(collectorRef);
            const company = collectorSnap.exists() ? collectorSnap.data().companyName || '' : '';
            await updateDoc(doc(db, 'requests', r.id), {
              status: 'assigned',
              assignedTo: auth.currentUser.uid,
              assignedAt: new Date(),
              assignedCompanyName: company
            });
            alert('Request accepted.');
            window.location.href = 'collector-dashboard.html';
          } catch (err) { console.error(err); alert('Failed to accept request.'); }
        });
        actions.appendChild(btn);
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
