<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Profile | TrashAway</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="firebase.js"></script>
</head>
<body>

<div id="custom-cursor"><i data-lucide="settings"></i></div>

<div class="dashboard-container">
    <main class="main-content">
        <div class="dash-header">
            <h1>Company Profile</h1>
        </div>

        <div class="glass-panel">
            <!-- LOGO UPLOAD -->
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="profile-avatar-wrap">
                    <img id="company-logo" src="placeholder.jpg" alt="Company Logo" class="avatar-circle" />
                    <input type="file" id="logo-upload" style="display: none;" accept="image/*" />
                    <button class="avatar-edit-btn" onclick="document.getElementById('logo-upload').click()">
                        <i data-lucide="camera"></i>
                    </button>
                </div>
                <div>
                    <h2 id="display-name">GreenMove Ltd</h2>
                    <p id="display-email">contact@greenmove.com</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { auth, db } from './firebase.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const storage = getStorage();
    const logoInput = document.getElementById('logo-upload');
    const logoImage = document.getElementById('company-logo');

    logoInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) {
            const storageRef = ref(storage, `logos/${auth.currentUser.uid}`);
            await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);
            logoImage.src = downloadURL;
            // Optionally save the downloadURL to Firestore
        }
    });
</script>
</body>
</html>
