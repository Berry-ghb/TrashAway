<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrashAway</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="firebase.js"></script>
    <style>
        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }

        .login-wrapper { width: 100%; max-width: 420px; }

        .login-logo { text-align: center; margin-bottom: 28px; }
        .login-logo a { font-size: 26px; font-weight: 900; text-decoration: none; color: var(--text); }
        .login-logo a span { color: var(--primary); }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--glass-border);
            padding: 40px; border-radius: 28px;
            box-shadow: var(--shadow-lg);
        }

        .login-card h2 { font-size: 26px; font-weight: 900; margin-bottom: 6px; color: var(--text); }
        .login-card .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .forgot { text-align: right; font-size: 12px; margin-top: 6px; }
        .forgot a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
        .divider span { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--input-border); }

        .signup-link { text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 20px; }
        .signup-link a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .role-hint {
            background: var(--primary-light); border: 1px solid rgba(0,168,68,0.2);
            border-radius: 12px; padding: 12px 16px; font-size: 13px;
            color: var(--text-muted); margin-bottom: 20px; text-align: center;
        }
        .role-hint strong { color: var(--primary); }
    </style>

</head>
<body>
    <div id="custom-cursor"><i data-lucide="lock"></i></div>

    <div class="login-wrapper">
        <div class="login-logo">
            <a href="index.html">Trash<span>Away</span></a>
        </div>

        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="sub">Log in to manage your waste collection.</p>

            <div class="role-hint">
                Logging in as a <strong>Resident</strong>? Use your registered email. <br>
                Collectors log in with their <strong>business email</strong>.
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="input-field" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                    <div class="forgot"><a href="#">Forgot password?</a></div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">Sign In →</button>
            </form>

            <div class="divider"><span>or</span></div>

            <div class="signup-link">
                New here? <a href="signup.html">Create an account</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { setExplicitLoginFlag } from './app-utils.js';

        lucide.createIcons();

        // Cursor
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Enforce dark theme
        document.body.classList.add('light-theme');


        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.querySelector('input[type="email"]').value.trim();
            const password = document.querySelector('input[type="password"]').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (!userData.emailVerified) {
                        alert('Please verify your email before logging in. Check your inbox for the verification code.');
                        await auth.signOut();
                        return;
                    }
                    setExplicitLoginFlag();
                    localStorage.setItem('trashaway-user-role', 'user');
                    window.location.href = 'dashboard.html';
                } else {
                    const collectorDoc = await getDoc(doc(db, 'collectors', user.uid));
                    if (collectorDoc.exists()) {
                        const collectorData = collectorDoc.data();
                        if (!collectorData.emailVerified) {
                            alert('Please verify your email before logging in. Check your inbox for the verification code.');
                            await auth.signOut();
                            return;
                        }
                        setExplicitLoginFlag();
                        localStorage.setItem('trashaway-user-role', 'collector');
                        window.location.href = 'collector-dashboard.html';
                    } else {
                        alert('Account not found. Please sign up first.');
                        await auth.signOut();
                    }
                }

            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = 'Failed to log in. Please check your credentials.';
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email. Please sign up first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Please enter a valid email address.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'This account has been disabled.';
                }
                
                alert(errorMessage);
            }
        }

        // Make handleLogin available globally
        window.handleLogin = handleLogin;
    </script>

</body>
</html>
