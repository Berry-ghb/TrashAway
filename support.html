<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support | TrashAway</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="custom-cursor"><i data-lucide="life-buoy"></i></div>

  <div class="nav-container">
    <nav class="dynamic-island">
      <div class="island-content">
        <a href="dashboard.html" class="logo-brand">
          <img src="image.png" alt="TrashAway Logo" class="logo-img">
        </a>
        <div class="island-right">
          <a href="dashboard.html" class="btn-outline">Back to Dashboard</a>
        </div>
      </div>
    </nav>
  </div>

  <main class="section" style="max-width:820px; margin:120px auto 100px;">
    <div class="glass-panel" style="padding:36px;">
      <h1>Support & Feedback</h1>
      <p class="hero-p">Report an issue or send feedback. We'll receive your message at our support inbox and reply to guide you.</p>

      <form id="support-form" style="margin-top:18px;">
        <div class="form-group">
          <label>Your name</label>
          <input id="name" class="input-field" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Your email</label>
          <input id="email" type="email" class="input-field" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input id="subject" class="input-field" placeholder="Short subject" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="message" class="input-field" rows="6" placeholder="Describe the issue or request"></textarea>
        </div>

        <div style="display:flex; gap:12px; margin-top:12px;">
          <button type="submit" class="btn-primary">Send Report</button>
          <a href="dashboard.html" class="btn-ghost">Cancel</a>
        </div>
      </form>

      <p style="margin-top:18px; color:var(--text-muted); font-size:13px;">Note: This will open your email client so you can send the report directly to our support inbox.</p>
    </div>
  </main>

  <script>
    lucide.createIcons();
    document.getElementById('support-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const to = 'oguntolaabdulmalik20@gmail.com';
      const name = encodeURIComponent(document.getElementById('name').value || '');
      const email = encodeURIComponent(document.getElementById('email').value || '');
      const subject = encodeURIComponent(document.getElementById('subject').value || 'Support request');
      const body = encodeURIComponent(`Name: ${decodeURIComponent(name)}\nEmail: ${decodeURIComponent(email)}\n\n${document.getElementById('message').value}`);
      // Open the user's email client with prefilled fields
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
